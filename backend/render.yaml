
services:
  - type: web
    name: rtsp-stream-viewer-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CAMERA_URL_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: rtsp-stream-viewer-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rtsp-stream-viewer-roan.vercel.app
      - key: FFMPEG_BINARY
        value: ffmpeg
      - key: RTSP_MAX_CONCURRENT_STREAMS
        value: "4"
      - key: FRONTEND_URL
        value: https://rtsp-stream-viewer-roan.vercel.app
      - key: EMAIL_HOST_USER
        value: vikassontakke2002@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
